name: Lint PHP

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-php-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-versions: ${{ steps.versions.outputs.php-versions }}

    steps:
      - name: Checkout app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get supported PHP versions
        id: versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2.3.1.3.2

  lint:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        php-versions: ${{ fromJson(needs.matrix.outputs.php-versions) }}

    name: PHP ${{ matrix.php-versions }}

    steps:
      - name: Checkout app
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint PHP files
        run: composer run lint

  summary:
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    permissions:
      contents: none
    name: php-lint-summary

    steps:
      - name: Verify lint matrix result
        run: if [ "${{ needs.lint.result }}" != "success" ]; then exit 1; fi
